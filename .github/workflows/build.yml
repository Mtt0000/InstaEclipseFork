name: Build All Branches

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Compilare tutti i branch in parallelo?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  get-branches:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set-branches.outputs.branches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect target branches
        id: set-branches
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_all }}" = "true" ]; then
            # Recupera tutti i branch remoti escludendo HEAD
            BRANCHES=$(git branch -r | grep -v '\->' | sed 's/origin\///' | tr -d ' ' | jq -R -s -c 'split("\n")[:-1]')
          else
            # Al push compila solo il singolo branch che ha ricevuto il commit
            BRANCHES=$(jq -nc --arg b "${{ github.ref_name }}" '[$b]')
          fi
          echo "branches=${BRANCHES}" >> $GITHUB_OUTPUT

  build:
    needs: get-branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.get-branches.outputs.branches) }}

    steps:
      - name: Checkout branch ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Name
        id: prep
        run: |
          mkdir -p dist
          SAFE_BRANCH=$(echo "${{ matrix.branch }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          cp app/build/outputs/apk/debug/*.apk dist/InstaEclipse-${SAFE_BRANCH}.apk
          echo "safe_branch=${SAFE_BRANCH}" >> $GITHUB_OUTPUT

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ steps.prep.outputs.safe_branch }}-${{ github.run_number }}
          name: Build (${{ matrix.branch }}) #${{ github.run_number }}
          body: |
            Release automatica generata per il branch **${{ matrix.branch }}**.
            Commit: ${{ github.sha }}
          files: dist/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

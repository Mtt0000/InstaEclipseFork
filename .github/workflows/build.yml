name: Build InstaEclipse APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/InstaEclipse-${{ github.ref_name }}.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.ref_name }}
          name: Build (${{ github.ref_name }})
          body: |
            Release automatica generata per il branch **${{ github.ref_name }}**.
            Ultimo commit: ${{ github.sha }}
          files: dist/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
